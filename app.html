<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seratus</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#131110" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Seratus" />
  <link rel="icon" href="/icons/seratus-100.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style/base.css" />
  <link rel="stylesheet" href="style/layout.css" />
  <link rel="stylesheet" href="style/settings.css" />
  <link rel="stylesheet" href="style/fonts.css" />
</head>
<body>

  <div id="app">
    <nav id="tab-bar"></nav>

    <div id="body-row">
      <div id="viewport">
        <div id="stage"></div>
        <div id="sidebar-edge">
          <button id="sidebar-toggle">‹</button>
        </div>
      </div>

      <aside id="sidebar">
        <div id="sidebar-header">
          <span id="sidebar-title">Notes</span>
        </div>
        <div id="sidebar-body"></div>
      </aside>
    </div>
  </div>

  <script src="lib/Sortable.min.js"></script>
  <script type="module" src="core/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>

</body>
</html>
